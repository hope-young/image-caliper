name: Release v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.0.4.yml"

permissions:
  contents: write

jobs:
  prepare:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.4 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## What's Changed

          - Added drag-and-drop image opening from Finder/File Explorer.
          - Improved macOS Finder drag-and-drop event handling.
          - Supports JPG, JPEG, PNG, BMP, TIF, TIFF, and PCX files.
          - Added macOS drag-and-drop CI coverage.
          - Synced the internal application version to 1.0.4.
          EOF
          gh release view v1.0.4 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create v1.0.4 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ImageCaliper 1.0.4" \
            --notes-file release-notes.md

  build:
    name: Build ${{ matrix.platform.name }}
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            runner: windows-latest
          - name: macos
            runner: macos-latest
          - name: linux-x64
            runner: ubuntu-latest

    steps:
      - name: Check out v1.0.4
        uses: actions/checkout@v4
        with:
          ref: v1.0.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name ImageCaliper --icon "${{ github.workspace }}\assets\imagecaliper-icon.ico" --add-data "${{ github.workspace }}\assets;assets" --distpath dist --workpath build --specpath build packaging\run_imagecaliper.py
          Compress-Archive -Path dist\ImageCaliper\* -DestinationPath ImageCaliper-v1.0.4-windows-x64.zip -Force

      - name: Build app on macOS
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name ImageCaliper --icon "${{ github.workspace }}/assets/imagecaliper-icon.ico" --add-data "${{ github.workspace }}/assets:assets" --distpath dist --workpath build --specpath build packaging/run_imagecaliper.py
          ditto -c -k --sequesterRsrc --keepParent dist/ImageCaliper.app ImageCaliper-v1.0.4-macos.zip

      - name: Build app on Linux
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name ImageCaliper --add-data "${{ github.workspace }}/assets:assets" --distpath dist --workpath build --specpath build packaging/run_imagecaliper.py
          tar -czf ImageCaliper-v1.0.4-linux-x64.tar.gz -C dist ImageCaliper

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageCaliper-v1.0.4-${{ matrix.platform.name }}
          path: |
            ImageCaliper-v1.0.4-*.zip
            ImageCaliper-v1.0.4-*.tar.gz

      - name: Upload asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.4 ImageCaliper-v1.0.4-* --repo "${{ github.repository }}" --clobber
